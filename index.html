function sec(t,s,b,c){return '<section class="'+(c||"")+'"><div class="w"><h2>'+t+'</h2>'+(s?'<p class="sub">'+s+'</p>':'')+b+'</div></section>'}
var PG={
home:function(){var bi=function(o){return X.books.indexOf(o)};return '<div class="hero"><div class="w"><div class="live">'+S("live_banner")+'</div><h1>'+S("hero_title")+'</h1><p>'+S("hero_text")+'</p><a class="btn" href="#register">'+T("Register now","سجّل الآن")+'</a> <a class="btn o" href="#assess">'+T("Take a free assessment","اختبر مستواك")+'</a></div></div><div class="band"><p>🎓 '+S("certificates")+'</p></div>'+
sec(S("featured_title"),S("featured_sub"),'<div class="g">'+pickTop(X.courses,4).map(cc).join("")+'</div><p><a class="btn n" href="#courses">'+T("See all courses","عرض كل الدورات")+'</a></p>')+
(X.offers.length?sec(S("offers_title"),"",'<div class="g">'+X.offers.map(function(o){return '<div class="card"><div class="ic">🏷️</div><h3>'+G(o,"title")+'</h3><p>'+G(o,"text")+'</p>'+(o.link?'<a class="btn sm" href="'+U(o.link)+'" target="_blank" rel="noopener">'+T("Details","التفاصيل")+'</a>':'')+'</div>'}).join("")+'</div>',"alt"):"")+
sec(S("popular_title"),"",'<div class="g">'+pickTop(X.books,3).map(function(b){return bc(b,bi(b))}).join("")+'</div><p><a class="btn n" href="#books">'+T("Visit the book shop","زر متجر الكتب")+'</a></p>')+
'<div class="w" style="padding-block:20px"><div class="cta"><div><h2>'+S("cta_title")+'</h2><p>'+S("cta_text")+'</p></div><a class="btn" href="#register">'+T("Register","التسجيل")+'</a></div></div>'},
about:function(){return hd("about")+'<section><div class="w two"><div><h2>'+S("about_who_title")+'</h2><p>'+S("about_who")+'</p><h2>'+S("about_mission_title")+'</h2><p>'+S("about_mission")+'</p></div><div><h2>'+S("about_approach_title")+'</h2><p>'+S("about_approach")+'</p><h2>'+S("about_qual_title")+'</h2><p>'+S("about_qual")+'</p></div></div></section>'},
courses:function(){return hd("courses")+'<section><div class="w"><form onsubmit="return false" style="max-width:480px;margin-bottom:22px"><input id="q" type="search" placeholder="'+T("Search courses (e.g. IELTS, Excel, German)","ابحث عن دورة (مثل IELTS، إكسل، ألمانية)")+'" aria-label="search"></form><div class="g" id="cg">'+X.courses.map(cc).join("")+'</div><p id="nr" hidden>'+T("No matching course. Ask us on WhatsApp, we may offer it.","لا توجد دورة مطابقة. اسألنا عبر واتساب، قد نقدّمها.")+'</p></div></section>'},
books:function(){return hd("books")+'<section><div class="w"><div class="g">'+X.books.map(bc).join("")+'</div></div></section>'},
assess:function(){return hd("assess")+'<section><div class="w"><div class="g">'+X.assess.map(function(a){return '<div class="card"><div class="ic">'+E(a.icon||"📝")+'</div><h3>'+G(a,"title")+'</h3><p>'+G(a,"desc")+'</p><a class="btn sm" target="_blank" rel="noopener" href="'+U(a.link)+'">'+T("Start","ابدأ")+'</a></div>'}).join("")+'</div></div></section>'},
articles:function(){return hd("articles")+'<section><div class="w" style="max-width:780px">'+X.articles.map(function(a){return '<details><summary>'+G(a,"title")+'</summary>'+(a.date?'<p class="m">'+E(a.date)+'</p>':'')+'<p>'+G(a,"text")+'</p></details>'}).join("")+'</div></section>'},
inst:function(){return hd("inst")+'<section><div class="w two"><div><h2>'+S("inst_heading")+'</h2><p>'+S("inst_text")+'</p></div><form data-t="Institutional training request">'+fld("Organization",T("Organization","اسم المؤسسة"),"required")+fld("Contact person",T("Contact person","الشخص المسؤول"),"required")+fld("Phone",T("Phone","الهاتف"),'type="tel" required')+fld("Participants",T("Number of participants","عدد المشاركين"))+'<label>'+T("Training needs","احتياجات التدريب")+'<textarea name="Needs" rows="3"></textarea></label><button class="btn">'+T("Request proposal","اطلب العرض")+'</button></form></div></section>'},
register:function(){return hd("register")+'<section><div class="w"><form data-t="Course registration">'+fld("Student name",T("Student name","اسم الطالب"),"required")+fld("Age",T("Age","العمر"),'type="number"')+fld("Parent/guardian (if under 18)",T("Parent / guardian name (if under 18)","اسم ولي الأمر (إذا كان الطالب دون 18)"))+fld("Phone",T("Phone / WhatsApp","الهاتف / واتساب"),'type="tel" required')+fld("Email",T("Email (optional)","البريد الإلكتروني (اختياري)"),'type="email"')+'<label>'+T("Course","الدورة")+'<select name="Course">'+X.courses.concat([{title_en:"Other",title_ar:"أخرى"}]).map(function(c){return '<option value="'+E(c.title_en)+'"'+(c.title_en==pick?" selected":"")+'>'+G(c,"title")+'</option>'}).join("")+'</select></label><label>'+T("Delivery","نمط الدورة")+'<select name="Delivery"><option value="Online live">'+T("Live online","أونلاين مباشر")+'</option><option value="Onsite">'+T("Onsite / in person","حضوري")+'</option><option value="Hybrid">'+T("Hybrid","مدمج")+'</option></select></label><label>'+T("Notes","ملاحظات")+'<textarea name="Notes" rows="3"></textarea></label><button class="btn">'+T("Send on WhatsApp","أرسل عبر واتساب")+'</button></form>'+(V("registration_form_url")?'<p><a href="'+U(V("registration_form_url"))+'" target="_blank" rel="noopener">'+T("Prefer a form? Open the Google registration form.","تفضّل نموذجاً؟ افتح نموذج التسجيل على جوجل.")+'</a></p>':'')+'</div></section>'},
contact:function(){var l=function(k,t){return V(k)?' · <a href="'+U(V(k))+'" target="_blank" rel="noopener">'+t+'</a>':''};return hd("contact")+'<section><div class="w two"><div class="g" style="grid-template-columns:1fr"><div class="card"><h3>💬 WhatsApp</h3><p><a href="'+msg("Hello")+'" target="_blank" rel="noopener">'+E(V("whatsapp_display"))+'</a></p></div><div class="card"><h3>📞 '+T("Phone","الهاتف")+'</h3><p><a href="tel:'+E(V("phone"))+'">'+E(V("phone_display"))+'</a>'+(V("email")?'<br><a href="mailto:'+E(V("email"))+'">'+E(V("email"))+'</a>':'')+'</p></div><div class="card"><h3>📍 '+T("Address","العنوان")+'</h3><p>'+S("address")+'<br>'+S("hours")+'<br><a href="'+U(V("map_url"))+'" target="_blank" rel="noopener">'+T("Get directions","الاتجاهات")+'</a>'+l("facebook","Facebook")+l("instagram","Instagram")+'</p></div></div><form data-t="Contact message">'+fld("Name",T("Name","الاسم"),"required")+fld("Phone",T("Phone","الهاتف"),'type="tel"')+'<label>'+T("Message","الرسالة")+'<textarea name="Message" rows="4" required></textarea></label><button class="btn">'+T("Send on WhatsApp","أرسل عبر واتساب")+'</button></form></div></section>'}};
function render(keep){var h=(location.hash||"#home").slice(1);if(!PG[h])h="home";document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
$("nv").innerHTML=NAV.map(function(n){return '<a href="#'+n[0]+'"'+(n[0]==h?' class="on"':'')+'>'+T(n[1],n[2])+'</a>'}).join("");
$("lg").textContent=L=="ar"?"English":"عربي";$("app").innerHTML=PG[h]();$("nv").classList.remove("open");
$("cart").style.display=h=="books"||h=="home"?"block":"none";cnt();
$("ft").innerHTML='<div class="w two"><div><img src="logo.png" alt=""><p>'+S("certificates")+'</p></div><div><p>'+S("footer_text")+'<br>WhatsApp: <a href="'+msg("Hello")+'">'+E(V("whatsapp_display"))+'</a><br>'+S("hours")+(V("facebook")?'<br><a href="'+U(V("facebook"))+'" target="_blank" rel="noopener">Facebook</a>':'')+(V("instagram")?' · <a href="'+U(V("instagram"))+'" target="_blank" rel="noopener">Instagram</a>':'')+'</p></div></div>';if(keep!==true)scrollTo(0,0)}
function cnt(){var n=0;for(var k in cart)n+=cart[k];$("cart").textContent="🛒 "+T("Order","الطلب")+" ("+n+")"}
function openCart(){var t=0,h="";for(var k in cart){var b=X.books[k];if(!b)continue;t+=cart[k]*(parseFloat(b.price)||0);h+='<div class="r"><span>'+G(b,"title")+' × '+cart[k]+'</span><button class="btn sm n" data-r="'+k+'">−</button></div>'}
$("dlg").innerHTML='<h3>'+T("Your order","طلبك")+'</h3>'+(h||"<p>"+T("Your order is empty.","طلبك فارغ.")+"</p>")+'<p><b>'+T("Total","المجموع")+': $'+t+'</b></p><form data-t="Book order" data-x="'+t+'">'+fld("Name",T("Your name","اسمك"),"required")+fld("Phone",T("Phone","الهاتف"),'type="tel" required')+'<div style="display:flex;gap:8px"><button class="btn"'+(h?"":" disabled")+'>'+T("Send on WhatsApp","أرسل عبر واتساب")+'</button><button type="button" class="btn n" id="x">'+T("Close","إغلاق")+'</button></div></form>';if(!$("dlg").open)$("dlg").showModal()}
document.addEventListener("click",function(e){var d=e.target.dataset;if(d.b!==undefined){cart[d.b]=(cart[d.b]||0)+1;cnt();e.target.textContent="✓"}
if(d.r!==undefined){if(--cart[d.r]<=0)delete cart[d.r];cnt();openCart()}if(d.c)pick=d.c;if(e.target.id=="x")$("dlg").close()});
document.addEventListener("input",function(e){if(e.target.id!="q")return;var v=e.target.value.toLowerCase(),n=0;[].forEach.call($("cg").children,function(c){var s=c.dataset.s.indexOf(v)>-1;c.hidden=!s;if(s)n++});$("nr").hidden=n>0});
document.addEventListener("submit",function(e){var f=e.target;if(!f.dataset.t)return;e.preventDefault();var s=f.dataset.t+"\n";
if(f.dataset.x){for(var k in cart)if(X.books[k])s+="- "+X.books[k].title_en+" x"+cart[k]+"\n";s+="Total: $"+f.dataset.x+"\n"}
[].forEach.call(f.elements,function(x){if(x.name&&x.value)s+=x.name+": "+x.value+"\n"});window.open(msg(s),"_blank")});
$("cart").onclick=openCart;$("lg").onclick=function(){L=L=="en"?"ar":"en";render(true)};$("mb").onclick=function(){$("nv").classList.toggle("open")};
addEventListener("hashchange",function(){render()});render();
// ---- load live data from the Google Sheet ----
function csv(t){var r=[],w=[],c="",q=0,i=0,h;for(;i<t.length;i++){h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}else if(h=='"')q=1;else if(h==","){w.push(c);c=""}else if(h=="\n"){w.push(c);r.push(w);w=[];c=""}else if(h!="\r")c+=h}if(c||w.length){w.push(c);r.push(w)}return r}
function tab(n,need){return fetch("https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&sheet="+n).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){var a=csv(t),H=(a.shift()||[]).map(function(x){return x.trim().toLowerCase()});if(H.indexOf(need)<0)throw 0;
return a.map(function(r){var o={};H.forEach(function(k,i){o[k]=(r[i]||"").trim()});return o}).filter(function(o){return !/^(no|n|false|0)$/i.test(o.active||"yes")&&Object.keys(o).some(function(k){return o[k]})})}).catch(function(){return null})}
if(SHEET_ID.indexOf("PASTE")<0)Promise.all([tab("Settings","key"),tab("Courses","title_en"),tab("Books","title_en"),tab("Articles","title_en"),tab("Offers","title_en"),tab("Assessments","title_en")]).then(function(R){
if(R[0])R[0].forEach(function(o){if(o.key&&(o.en||o.ar))X.settings[o.key]=[o.en,o.ar]});
["courses","books","articles","offers","assess"].forEach(function(k,i){if(R[i+1])X[k]=R[i+1]});render(true)});

</script></body></html>
