function $(i){return document.getElementById(i)}

function openCart(){var t=0,h="";for(var k in cart){t+=cart[k]*BOOKS[k][4];h+='<div class="r"><span>'+T(BOOKS[k][0],BOOKS[k][1])+' × '+cart[k]+'</span><button class="btn sm n" data-r="'+k+'">−</button></div>'}
